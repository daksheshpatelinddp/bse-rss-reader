# BSE RSS Reader – Extra monitor trigger via GitHub Actions
# Completely free (public repo recommended)
#
# Cloudflare Cron already runs every 1 minute during market hours.
# This workflow adds extra calls every 5 minutes as a free backup.

name: BSE Monitor Trigger

on:
  schedule:
    # Every 5 minutes from 01:30 to 17:30 UTC (≈ 7:00 AM – 11:00 PM IST)
    - cron: "*/5 1-17 * * *"
  workflow_dispatch: # manual run button

jobs:
  trigger-monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Call Cloudflare Worker /monitor
        run: |
          echo "Triggering monitor at $(date -u)"
          WORKER_URL="https://bse-rss-reader.daksheshpatelin.workers.dev/monitor"

          HTTP_CODE=$(curl -s -o /tmp/response.json -w "%{http_code}" \
            -X GET \
            -H "User-Agent: GitHub-Actions-BSE-Monitor/1.0" \
            -H "Cache-Control: no-cache" \
            --max-time 25 \
            "$WORKER_URL")

          echo "HTTP Status: $HTTP_CODE"
          cat /tmp/response.json
          echo ""

          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "✅ Monitor triggered successfully"
          else
            echo "⚠️ Monitor returned non-2xx status"
            exit 0
          fi

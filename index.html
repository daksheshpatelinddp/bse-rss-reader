<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>BSE Results Reader</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header class="topbar">
    <div>
      <h1>BSE Results Reader</h1>
      <div class="subtitle">
        BSE Financial Results
      </div>
    </div>

    <button id="refreshBtn" class="refresh-btn">
      ↻ Refresh
    </button>
  </header>


  <main>

    <!-- WHITELIST -->

    <section class="panel">

      <div class="panel-title">
        <h2>Whitelisted Companies</h2>
        <span id="watchCount">0</span>
      </div>

      <div class="add-row">

        <input
          id="companyInput"
          type="text"
          placeholder="Company name or BSE scrip"
          autocomplete="off"
        >

        <button id="addBtn">
          + Add
        </button>

      </div>

      <div id="whitelist" class="whitelist"></div>

    </section>


    <!-- FILTERS -->

    <section class="panel filters">

      <div class="filter-row">

        <input
          id="searchInput"
          type="search"
          placeholder="Search whitelisted results..."
        >

        <select id="resultTypeFilter">
          <option value="all">All Results</option>
          <option value="Audited">Audited</option>
          <option value="Unaudited">Unaudited</option>
        </select>

      </div>

    </section>


    <!-- STATUS -->

    <section class="status-bar">

      <span id="status">
        Loading...
      </span>

      <span id="lastUpdated"></span>

    </section>


    <!-- RESULTS -->

    <section>

      <div id="results" class="results"></div>

      <div id="empty" class="empty hidden">
        No matching results.
      </div>

    </section>

  </main>


  <script src="app.js"></script>

</body>
</html>
